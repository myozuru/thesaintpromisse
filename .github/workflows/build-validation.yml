name: Build validation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bunx tsc --noEmit

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bunx vitest run src/test/GuiaFormulasDialog.test.tsx src/test/omniAttackMetadata.test.tsx src/test/omniCondicionaisAtivos.test.tsx src/test/omniDanoAuditoria.test.tsx src/test/omniGuiaAuditoria.test.tsx src/test/omniNaturalInventoryAudit.test.ts

  controlador-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bunx vitest run src/test/controladorFundacao.test.ts src/test/controladorMapa.test.ts src/test/invocacoesSchema.test.ts src/test/criadorShikigami.test.ts

  omni-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bunx vitest run src/test/omniCargasSustentacao.test.tsx src/test/omniAcoesAgrupadas.test.tsx --reporter=verbose --testTimeout=15000

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bunx vitest run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run build
